spring.application.name=item-service
erp.openapi.description=Items, units of measure, BOMs, documents (MinIO) and customer orders
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itemdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Object storage. `endpoint` is what this service uses; `public-endpoint` is the address clients (browsers, curl on
# the host) use for presigned upload/download URLs - they must be able to reach it, and it is part of the signature.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:erp-assets}
minio.region=${MINIO_REGION:us-east-1}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A failing message is retried a few times, then dropped instead of being redelivered forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms

# Confirming an order checks stock in inventory-service (set to false to run without it).
erp.orders.check-stock-on-confirm=${ERP_ORDERS_CHECK_STOCK:true}
erp.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8083}
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

# Tokens are issued by user-service; keys are fetched from its JWKS endpoint on first use.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://auth-service:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
