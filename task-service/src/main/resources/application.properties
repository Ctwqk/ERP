spring.application.name=task-service
erp.openapi.description=Tasks with stock prerequisites and links to users, items, orders and documents
server.port=${SERVER_PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Calls to the other services: "http" talks to them with the caller's token, "stub" accepts everything.
erp.ports.mode=${ERP_PORTS_MODE:http}
erp.ports.user-service-url=${USER_SERVICE_URL:http://localhost:8081}
erp.ports.item-service-url=${ITEM_SERVICE_URL:http://localhost:8082}
erp.ports.inventory-service-url=${INVENTORY_SERVICE_URL:http://localhost:8083}
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

# Tokens are issued by user-service; keys are fetched from its JWKS endpoint on first use.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://auth-service:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
