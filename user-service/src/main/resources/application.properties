spring.application.name=user-service
erp.openapi.description=Users, roles and JWT issuing (login, JWKS)
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema is owned by Flyway (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Redis holds the access-token blacklist used by /auth/logout.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Access tokens (RS256). `issuer` must equal the issuer-uri configured on every resource server.
security.jwt.issuer=${JWT_ISSUER:http://auth-service:8080}
security.jwt.access-minutes=${JWT_ACCESS_MINUTES:60}

# Signing key. Leave the keystore location empty to generate an ephemeral RSA key at start-up (tokens then become
# invalid after a restart). To persist the key, point this at a PKCS12 keystore holding an RSA key under `alias`.
auth.keystore.location=${AUTH_KEYSTORE_LOCATION:}
auth.keystore.password=${AUTH_KEYSTORE_PASSWORD:}
auth.keystore.alias=${AUTH_KEY_ALIAS:auth-rsa}
auth.keystore.key-password=${AUTH_KEY_PASSWORD:}

# Optional first administrator, created at start-up when both values are set (never overwritten once it exists).
erp.bootstrap.admin.email=${ERP_ADMIN_EMAIL:}
erp.bootstrap.admin.password=${ERP_ADMIN_PASSWORD:}
erp.bootstrap.admin.name=${ERP_ADMIN_NAME:Administrator}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
