name: CI
on:
  push:
    branches: [main, portfolio-upgrade]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx512m
      COMPOSE_PARALLEL_LIMIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and integration tests (PostgreSQL, Redis, RabbitMQ, MinIO)
        run: ./mvnw -B -ntp verify
      - name: Full stack smoke test, including RabbitMQ delivery
        run: |
          cp .env.example .env
          mkdir -p docs/evidence
          set -o pipefail
          VERBOSE=1 ./scripts/stack-smoke.sh 2>&1 | tee docs/evidence/ci-smoke.txt
      - name: Remove test resources even after cancellation
        if: always()
        run: |
          if test -f .env; then docker compose down --volumes --remove-orphans; fi
          docker ps -aq --filter name=pu-erp-test- | xargs -r docker rm -f -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-evidence
          retention-days: 7
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            docs/evidence/ci-smoke.txt
